# Configuración de Nginx para peliculas.arturoalvarez.site
# Ubicación sugerida: /etc/nginx/sites-available/peliculas.arturoalvarez.site

server {
    listen 80;
    listen 443 ssl http2;
    server_name peliculas.arturoalvarez.site;

    # Certificados SSL (ajusta las rutas según tu configuración)
    ssl_certificate /etc/letsencrypt/live/peliculas.arturoalvarez.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peliculas.arturoalvarez.site/privkey.pem;

    # Logs
    access_log /var/log/nginx/peliculas.access.log;
    error_log /var/log/nginx/peliculas.error.log;

    # Unified frontend and API container
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Redirigir HTTP a HTTPS
    if ($scheme != "https") {
        return 301 https://$server_name$request_uri;
    }
}
