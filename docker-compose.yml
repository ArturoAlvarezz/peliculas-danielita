services:
  peliculas:
    image: arturoalvarez/peliculas-danielita:latest
    container_name: peliculas-danielita
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - peliculas-data:/app/data
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      OMDB_API_KEY: ${OMDB_API_KEY:?OMDB_API_KEY must be set}
      TMDB_API_KEY: ${TMDB_API_KEY:?TMDB_API_KEY must be set}
      WATCH_REGION: ${WATCH_REGION:-CL}

volumes:
  peliculas-data:
